name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-thumbnail-contract:
    name: iOS thumbnail sizing and sandbox contracts
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run Swift thumbnail contracts
        run: |
          xcrun swiftc \
            ios/Sources/MediaThumbnailSizing.swift \
            ios/Sources/MediaSandboxPath.swift \
            tests/ios-thumbnail/main.swift \
            -o "${RUNNER_TEMP}/pam-media-ios-thumbnail-contracts"
          "${RUNNER_TEMP}/pam-media-ios-thumbnail-contracts"

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict --no-check-lock
      - name: Install locked-compatible dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run package contracts
        run: |
          if [ -f tests/run.php ]; then
            php -d auto_prepend_file=vendor/autoload.php tests/run.php
          else
            composer test
          fi
